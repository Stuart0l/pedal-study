[project]
name = "pedalrig"
version = "0.1.0"
description = "Black-box guitar pedal measurement rig for the Ampero II Stomp"
authors = [
    { name = "Xuhao Luo", email = "rossihox@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "reportlab>=5.1.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
pedalrig = "pedalrig.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
